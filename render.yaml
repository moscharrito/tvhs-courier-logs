# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Auto-deploys on every push to the repo's default branch.
#
# Layout: npm workspaces at the repo root (server, web). The build installs the
# whole workspace from the root lockfile and compiles the server; the start
# command runs the compiled entry point, which boots the legacy TVHS server.
#
# Secrets (Turso connection + all logins) are marked `sync: false`, so Render
# PROMPTS you for them the first time you apply this blueprint and stores them
# securely in the service - they are NEVER written to this file or to git.
#
# Users are managed in-app (users API, ticket 0.7). ADMIN_USER / ADMIN_PASS only
# create the first admin on an empty database; after that they are ignored.
#
# Persistence: this app stores data in Turso (libSQL). Render has no persistent
# disk on web services, so TURSO_DATABASE_URL + TURSO_AUTH_TOKEN are required
# for data to survive restarts/deploys.
#
# PLAN: STARTER, AND IT MUST NOT GO BACK TO FREE.
#
# Two separate reasons, and both of them are now load-bearing:
#
#   The BAA.   Render's business associate agreement is only available on a
#              paid workspace. On free there is no agreement, so no patient
#              data may reach this service at all.
#   Sleeping.  A free instance sleeps when idle, and a sleeping instance runs
#              no timers. SWEEP_INTERVAL_SECONDS below is what escalates
#              unclaimed work to dispatch before its deadline and what drains
#              queued notification email. Asleep, an unclaimed STAT at 3am is
#              nobody's problem until somebody's request happens to wake the
#              service, which is precisely the failure the sweep exists to
#              prevent. We have told University Health that escalation is
#              automatic; on free it would not be.
#
# A staging service is still outstanding (ticket 0.10).
#
# The deploy, rollback and restore procedures are in docs/runbook.md.

services:
  - type: web
    name: tvhs-courier-logs
    runtime: node
    plan: starter
    # --include=dev IS LOAD-BEARING, do not tidy it away.
    #
    # Render sets NODE_ENV=production, which makes `npm ci` skip
    # devDependencies. Everything that BUILDS this project is a
    # devDependency: typescript, vite, vitest and the jest-dom types. Without
    # them the deploy of 2026-09-21 failed twice over, and the errors pointed
    # nowhere near the cause:
    #
    #   server  TS5108: Option 'moduleResolution=node10' has been removed
    #   web     TS2688: Cannot find type definition file for 'vite/client'
    #
    # The first one is the confusing one. With typescript absent, `tsc`
    # resolved to a newer compiler already on Render's image, and that one has
    # dropped the legacy `moduleResolution: "Node"` this repo uses. Nothing in
    # the repo had changed; the compiler had. The version in the lockfile,
    # 5.9.3, accepts it, so installing dev dependencies fixes both errors at
    # once and pins the compiler to the one the code was written against.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w server
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # --- Non-secret config ---
      - key: NODE_VERSION
        value: "20"

      # Set explicitly rather than relied on. Half of this application's
      # security posture hangs off it: Secure cookies, HSTS, and how many
      # proxy hops are trusted.
      # The server now refuses to start against a Turso database without it
      # (ticket 4.5), so a deploy that lost this value fails the health check
      # instead of quietly serving PHI with every control relaxed.
      - key: NODE_ENV
        value: production

      - key: APP_TIMEZONE
        value: America/Chicago
      - key: SESSION_SECRET
        generateValue: true            # Render generates a strong random value

      # Render terminates TLS and proxies to this service: exactly one hop.
      # Without it every audit row records Render's address instead of the
      # courier's, and the per-address auth throttle counts the whole internet
      # as one caller. Never `true`, which would trust a header from anyone.
      - key: TRUST_PROXY
        value: "1"

      # --- Turso database (create at turso.tech; paste when prompted) ---
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # --- Bootstrap admin (only used when the database has no admin yet) ---
      # Signs in with this password and creates everybody else, including a
      # second administrator. See docs/runbook.md for the first-deploy order.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false

      # --- The scheduler ---
      #
      # Switches on the unclaimed sweep, which hands work that nobody has
      # claimed to dispatch 45 minutes before its deadline, and drains the
      # notification queue. Without it both are written and neither runs: the
      # promise that an unclaimed STAT is never nobody's problem holds only
      # while somebody remembers to call the endpoint, and any email queued
      # for a pharmacy simply accumulates in the table.
      #
      # 120 seconds. The sweep raises work 45 minutes ahead of a deadline, so
      # the tick only has to be small against 45 minutes. Running twice is
      # harmless by design and there is a test for it: the sweep works from
      # the unassigned pool and claiming goes through a UNIQUE index, so two
      # instances sweeping together is wasted work rather than a double
      # assignment. That is why this is an in-process timer and not a cron
      # service holding a lock.
      - key: SWEEP_INTERVAL_SECONDS
        value: "120"

      # --- Notification email (docs/infra/email.md) ---
      #
      # Off until SES has a verified domain and has left the sandbox. The
      # bodies carry an order number, a pharmacy, a time and a link, and never
      # a patient: an email stops being ours the moment it is sent.
      #
      # MAIL_ENABLED with any of the rest missing is a BOOT FAILURE, the same
      # as FILES_ENABLED without a bucket, because a server that came up with
      # mail switched on and no credentials would quietly stop notifying a
      # hospital and nobody would notice for a fortnight.
      #
      # WHAT IS DECLARED HERE AND WHAT IS NOT.
      #
      # Non-secret settings live in this file, where they can be diffed and
      # explained. Only credentials are `sync: false`, which means Render
      # keeps whatever is in the service's Environment tab and this file never
      # overwrites it.
      #
      # That split matters because the blueprint WINS. A value declared here
      # is re-applied on every sync, so flipping MAIL_ENABLED in the dashboard
      # while this file said "false" would be quietly reverted, and a hospital
      # would stop being notified with nothing looking wrong. Flipping it is
      # therefore a commit, which is reviewable, and not a web form.
      #
      # ORDER: put the credentials in the dashboard FIRST, then flip the flag
      # here. The reverse boots a server with mail enabled and nothing behind
      # it, which is a boot failure by design.
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_FROM
        value: no-reply@mail.izyglobalservices.com
      - key: MAIL_PORTAL_URL
        value: https://logs.izyglobalservices.com
      - key: SES_REGION
        value: us-east-2
      - key: SES_ACCESS_KEY_ID
        sync: false
      - key: SES_SECRET_ACCESS_KEY
        sync: false
      # The bounce topic. An ARN carries the account id, so it stays out of
      # git with the credentials rather than sitting in a public-ish file.
      # Absent means the webhook refuses every message, which is the safe
      # default: with no expected topic its ownership check cannot be made.
      - key: SES_SNS_TOPIC_ARN
        sync: false

      # --- Address lookup, and the test-phase exemption ---
      #
      # The key geocodes PHARMACY addresses, which are business addresses.
      # Sending a DELIVERY address is refused in code, because that is a
      # patient's home and Google Maps Platform is excluded from Google's BAA.
      #
      # UH_PATIENT_GEOCODE_UNTIL lifts that refusal for a dated window, and is
      # lawful only while every address in the database is invented. It is a
      # date rather than a flag so it lapses on its own, it is capped at 90
      # days, and the go-live readiness check reports it as a BLOCKER while it
      # is live. It must not be renewed once a real University Health list is
      # loaded. See docs/infra/accounts-and-baas.md.
      # - key: GOOGLE_MAPS_API_KEY
      #   sync: false
      # - key: UH_PATIENT_GEOCODE_UNTIL
      #   sync: false

      # --- Proof-of-delivery file storage (ticket 1.8) ---
      #
      # The AWS BAA is signed; what is missing now is the bucket itself.
      # docs/infra/create-pod-bucket.sh builds it in the order that matters
      # and prints these six values once.
      #
      # ALL FIVE S3 VALUES GO IN WITH FILES_ENABLED, IN ONE SAVE. Enabling it
      # alone is a boot failure by design (src/config.ts), and on this service
      # that is production down with live TVHS drivers filing against it.
      #
      # Doorstep photographs are PHI in a bucket, so this stays off until
      # there is a bucket covered by that BAA. With it off, the stop
      # screen refuses a doorstep delivery rather than losing the photograph.
      # Same split as the mail block above: settings here, credentials in the
      # dashboard. Flip FILES_ENABLED to "true" in a COMMIT once the bucket
      # exists and the three secrets are set, never in the web form, or the
      # next blueprint sync turns photographs back off.
      - key: FILES_ENABLED
        value: "false"
      - key: S3_BUCKET
        value: izy-courier-pod-767bd8
      - key: S3_REGION
        value: us-east-2
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # An ARN, so it carries the account id. Out of git with the rest.
      - key: S3_KMS_KEY_ID
        sync: false
