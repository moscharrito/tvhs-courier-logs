<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14532d" />
    <title>TAG</title>
    <style>
      /* Shown until the bundle mounts; the React <Loading full /> takes over
         with the same look, so there is no flash between the two. */
      html, body { margin: 0; height: 100%; background: #f6f8f7; }
      .tag-boot { min-height: 100vh; display: grid; place-items: center; }
      .tag-boot div { display: inline-flex; gap: 8px; }
      .tag-boot span { width: 12px; height: 12px; border-radius: 50%; background: #16a34a; opacity: .35; animation: tag-boot-dot 1.1s ease-in-out infinite; }
      .tag-boot span:nth-child(2) { animation-delay: .18s; }
      .tag-boot span:nth-child(3) { animation-delay: .36s; }
      @keyframes tag-boot-dot { 0%, 80%, 100% { transform: translateY(0) scale(.85); opacity: .35; } 40% { transform: translateY(-8px) scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="tag-boot" role="status" aria-label="Loading"><div><span></span><span></span><span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
